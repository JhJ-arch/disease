<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감염병 목록</title>
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 가독성 높은 Noto Sans KR 웹폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-100 selection:text-blue-900 min-h-screen flex flex-col">

  <!-- =====================================================================
       1. 상단 헤더: 타이틀 및 간단한 탐구 안내 문구
       ===================================================================== -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-10 text-center">
      <h1 class="text-2xl sm:text-4xl font-bold tracking-tight text-slate-900 mb-3">
        감염병 목록
      </h1>
      <p class="text-sm sm:text-base text-slate-600 leading-relaxed">
        감염병 이름을 누르면 어떻게 옮는지와 어떤 증상이 나타나는지 확인할 수 있습니다.
      </p>
    </div>
  </header>

  <!-- =====================================================================
       2. 메인 영역: 분류나 힌트 없이 이름만 나열된 20개 감염병 격자 목록
       ===================================================================== -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-10">
    <div
      id="disease-grid"
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4"
      role="list"
    >
      <!-- JavaScript에서 20개 감염병 카드를 렌더링합니다 -->
    </div>
  </main>

  <!-- =====================================================================
       3. 상세 정보 모달: 학생이 감염병을 눌렀을 때 전파 경로와 증상 표시
       ===================================================================== -->
  <div
    id="detail-modal"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/50 backdrop-blur-2xs"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <div
      id="modal-panel"
      class="bg-white w-full max-w-lg rounded-2xl border border-slate-200 shadow-xl overflow-hidden"
    >
      <!-- 모달 상단: 감염병 이름 & 전파 경로 라벨 -->
      <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between gap-3">
        <h2 id="modal-title" class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">
          감염병 이름
        </h2>
        <div class="flex items-center gap-2 shrink-0">
          <span class="text-xs font-medium text-slate-400">전파 경로</span>
          <span
            id="modal-transmission-badge"
            class="inline-block px-3 py-1 text-xs sm:text-sm font-bold rounded-full border"
          >
            전파 경로
          </span>
        </div>
      </div>

      <!-- 모달 본문: 전파 방식 설명 & 주요 증상 설명 -->
      <div class="px-6 py-5 space-y-4">
        <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
          <h3 class="text-xs sm:text-sm font-bold text-slate-700 mb-1.5">
            어떻게 옮나요?
          </h3>
          <p id="modal-transmission-detail" class="text-sm sm:text-base text-slate-800 leading-relaxed">
            전파 경로 설명
          </p>
        </div>

        <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
          <h3 class="text-xs sm:text-sm font-bold text-slate-700 mb-1.5">
            어떤 증상이 나타나나요?
          </h3>
          <p id="modal-symptoms" class="text-sm sm:text-base text-slate-800 leading-relaxed">
            증상 설명
          </p>
        </div>
      </div>

      <!-- 모달 하단: 닫기 버튼 -->
      <div class="px-6 py-4 bg-slate-50/70 border-t border-slate-100 flex justify-end">
        <button
          type="button"
          id="modal-close-btn"
          class="w-full sm:w-auto px-6 py-2.5 text-sm sm:text-base font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded-xl transition-colors"
        >
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- 하단 푸터 -->
  <footer class="bg-white border-t border-slate-200/70 py-4 mt-auto">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 text-xs text-slate-400 text-center">
      초등학교 3학년 탐구 학습용 감염병 목록
    </div>
  </footer>

  <script>
    /**
     * [20종 감염병 데이터 - 전파 경로가 한쪽으로 뭉치지 않도록 혼합 배치]
     */
    const DISEASE_DATA = [
      {
        id: "disease_01",
        name: "수두",
        transmission: "공기",
        transmission_detail: "환자가 숨쉬거나 기침할 때 공기 중에 떠다니는 아주 작은 바이러스를 들이마셔 옮습니다.",
        symptoms: "열이 나면서 온몸에 몹시 가려운 붉은 반점이 생기고, 투명한 물집으로 변했다가 딱지가 됩니다."
      },
      {
        id: "disease_02",
        name: "노로바이러스 장염",
        transmission: "물",

        symptoms: "속이 울렁거리며 갑자기 토를 하고, 물처럼 묽은 설사를 하며 배가 쥐어짜듯 아픕니다."
      },
      {
        id: "disease_03",
        name: "감기",
        transmission: "비말",
        transmission_detail: "감기에 걸린 친구가 기침이나 재채기를 할 때 튀어나오는 작은 침방울이 내 코나 입으로 들어가 옮습니다.",
        symptoms: "콧물이 나고 코가 막히며, 목이 따갑고 기침이 나면서 열이 살짝 오릅니다."
      },
      {
        id: "disease_04",
        name: "유행성 눈병",
        transmission: "접촉",
        transmission_detail: "환자의 눈곱이나 눈물이 묻은 손, 수건, 문고리를 만진 뒤 자기 눈을 비비면 옮습니다.",
        symptoms: "눈이 토끼 눈처럼 빨개지고 눈곱이 많이 끼며, 눈에 모래가 들어간 것처럼 따갑습니다."
      },
      {
        id: "disease_05",
        name: "볼거리",

        transmission_detail: "환자와 컵, 숟가락, 빨대를 같이 쓰거나 침이 묻은 물건을 입에 대면 침을 통해 옮습니다.",
        symptoms: "귀 아래쪽 턱선이 퉁퉁 붓고 아프며, 특히 음식을 씹을 때 귀 밑이 더 욱신거립니다."
      },
      {
        id: "disease_06",
        name: "A형 간염",

        transmission_detail: "오염된 물을 마시거나, 오염된 바닷물에서 자란 조개 등을 충분히 익히지 않고 먹으면 옮습니다.",
        symptoms: "온몸에 힘이 없고 속이 메스꺼우며, 눈의 흰자위와 얼굴 피부가 노랗게 변합니다."
      },
      {
        id: "disease_07",
        name: "독감",
        transmission: "비말",
        transmission_detail: "환자가 기침이나 재채기를 할 때 튄 침방울을 가까운 거리에서 들이마셔 감염됩니다.",
        symptoms: "갑자기 아주 높은 열이 나고, 머리와 온몸이 쑤시듯 아프며 심한 기침이 납니다."
      },
      {
        id: "disease_08",
        name: "수족구병",
        transmission: "접촉",
        transmission_detail: "환자의 물집 진물이나 침이 묻은 장난감, 책상, 손잡이를 만진 손으로 입을 만지면 옮습니다.",
        symptoms: "손바닥, 발바닥, 입안에 붉은 반점과 물집이 잡히고, 입안이 헐어 밥을 먹기 힘듭니다."
      },
      {
        id: "disease_09",
        name: "홍역",

        transmission_detail: "환자의 호흡기에서 나와 공기 중에 오랫동안 떠다니는 바이러스를 숨쉴 때 들이마셔 감염됩니다.",
        symptoms: "높은 열과 기침, 콧물이 나다가 귀 뒤쪽부터 시작해 온몸으로 붉은 반점이 빠르게 퍼집니다."
      },
      {
        id: "disease_10",
        name: "입술 물집",

        transmission_detail: "입술에 물집이 생긴 사람과 물병, 숟가락, 립밤 등을 함께 쓰면서 침이 닿아 옮습니다.",
        symptoms: "입술 가장자리가 따끔거리고 가렵다가 작은 물집들이 옹기종기 생기고 딱지가 앉습니다."
      },
      {
        id: "disease_11",
        name: "농가진",
        transmission: "접촉",
        transmission_detail: "상처 난 피부에 환자의 진물이 닿거나, 환자가 쓴 수건·옷을 함께 쓰면서 세균이 옮습니다.",
        symptoms: "피부에 붉은 반점과 물집이 생겼다가 금방 터지면서 노랗고 두꺼운 딱지가 앉고 가렵습니다."
      },
      {
        id: "disease_12",
        name: "백일해",
        transmission: "비말",
        transmission_detail: "환자가 기침할 때 튀는 침방울을 통해 옆에 있는 사람에게 쉽게 옮습니다.",
        symptoms: "처음엔 감기 같다가, 숨을 들이쉴 때 '웁' 소리가 날 정도로 멈추지 않는 심한 기침을 합니다."
      },
      {
        id: "disease_13",
        name: "콜레라",
        transmission: "물",
        transmission_detail: "병원균이 들어 있는 오염된 강물이나 지하수를 마시거나, 그 물에 씻은 날음식을 먹으면 옮습니다.",
        symptoms: "배는 별로 아프지 않지만 쌀뜨물처럼 희뿌연 설사를 갑자기 많이 하여 몸이 축 처집니다."
      },
      {
        id: "disease_14",
        name: "결핵",
        transmission: "공기",
        transmission_detail: "결핵 환자가 기침할 때 공기 중으로 퍼진 아주 미세한 결핵균이 떠다니다 폐로 들어가 옮습니다.",
        symptoms: "2주 넘게 기침과 가래가 멈추지 않고, 저녁마다 열이 살짝 나며 쉽게 지치고 살이 빠집니다."
      },
      {
        id: "disease_15",
        name: "구내염",
        transmission: "침",
        transmission_detail: "환자의 침이 묻은 장난감이나 식기, 음료수를 함께 사용하면서 침을 통해 감염됩니다.",
        symptoms: "열이 나면서 입안과 목젖 주변에 하얀 물집이 생기고 헐어서 침이나 음식을 삼키기 아픕니다."
      },
      {
        id: "disease_16",
        name: "무좀",
        transmission: "접촉",
        transmission_detail: "환자의 발 각질이 떨어진 수영장 바닥, 공용 슬리퍼, 발수건 등에 맨발이 닿아 옮습니다.",
        symptoms: "발가락 사이나 발바닥 피부가 하얗게 불어서 갈라지고, 껍질이 벗겨지며 몹시 가렵습니다."
      },
      {
        id: "disease_17",
        name: "코로나19",
        transmission: "비말",
        transmission_detail: "기침, 재채기, 큰 소리로 대화를 할 때 나오는 침방울이 주변 사람의 코와 입으로 들어가 옮습니다.",
        symptoms: "열이 나고 마른기침이 나며, 목이 몹시 아프고 음식 맛이나 냄새가 잘 안 느껴질 수 있습니다."
      },
      {
        id: "disease_18",
        name: "로타바이러스 장염",
        transmission: "물",
        transmission_detail: "바이러스에 오염된 물을 마시거나, 그 물로 씻은 음식을 먹었을 때 장으로 들어가 옮습니다.",
        symptoms: "열이 나고 토를 한 뒤, 하루에도 여러 번 심한 물설사를 해서 몸의 수분이 빠르게 빠집니다."
      },
      {
        id: "disease_19",
        name: "사스",
        transmission: "공기",
        transmission_detail: "환자가 기침하거나 숨쉴 때 공기 중에 떠다니는 미세한 침 입자를 들이마셔 감염됩니다.",
        symptoms: "갑자기 높은 열이 나고 온몸이 쑤시며, 마른기침이 심해지면서 숨을 쉬기 답답해집니다."
      },
      {
        id: "disease_20",
        name: "충치균 감염",
        transmission: "침",
        transmission_detail: "충치균이 많은 사람의 숟가락으로 음식을 받아먹거나 컵을 돌려 마시면 침을 통해 균이 옮습니다.",
        symptoms: "이가 시리고 음식을 씹을 때 찌릿하게 아프며, 치아 표면에 까만 점이나 구멍이 생깁니다."
      }
    ];

    // 상세 모달 내부에서만 사용되는 전파 경로 배지 스타일
    const BADGE_STYLES = {
      "비말": "bg-sky-50 text-sky-800 border-sky-200",
      "침": "bg-amber-50 text-amber-800 border-amber-200",
      "물": "bg-teal-50 text-teal-800 border-teal-200",
      "접촉": "bg-rose-50 text-rose-800 border-rose-200",
      "공기": "bg-indigo-50 text-indigo-800 border-indigo-200"
    };

    // DOM 요소 참조
    const diseaseGrid = document.getElementById("disease-grid");
    const detailModal = document.getElementById("detail-modal");
    const modalPanel = document.getElementById("modal-panel");
    const modalTitle = document.getElementById("modal-title");
    const modalTransmissionBadge = document.getElementById("modal-transmission-badge");
    const modalTransmissionDetail = document.getElementById("modal-transmission-detail");
    const modalSymptoms = document.getElementById("modal-symptoms");
    const modalCloseBtn = document.getElementById("modal-close-btn");

    // 모달을 연 트리거 버튼 기억 (닫을 때 포커스 복귀용)
    let lastFocusedTrigger = null;

    /**
     * 초기 화면에 20개 감염병 이름 버튼을 단일 목록(격자)으로 렌더링합니다.
     * 학생들이 클릭 전 미리 전파 경로를 유추하지 않도록 이름 외의 힌트는 표시하지 않습니다.
     */
    function renderDiseaseList() {
      diseaseGrid.innerHTML = "";

      DISEASE_DATA.forEach((disease) => {
        const button = document.createElement("button");
        button.type = "button";
        button.setAttribute("role", "listitem");
        button.className =
          "w-full bg-white border border-slate-200 hover:border-blue-500 hover:bg-blue-50/40 active:bg-blue-50 rounded-2xl px-4 py-5 sm:py-6 text-center shadow-2xs hover:shadow-sm transition-all cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500";

        const nameSpan = document.createElement("span");
        nameSpan.className = "block text-base sm:text-lg font-bold text-slate-800 tracking-tight break-keep";
        nameSpan.textContent = disease.name;

        button.appendChild(nameSpan);
        button.addEventListener("click", () => {
          openDetailModal(disease, button);
        });

        diseaseGrid.appendChild(button);
      });
    }

    /**
     * 선택한 감염병의 상세 정보 모달을 엽니다.
     */
    function openDetailModal(disease, triggerEl) {
      lastFocusedTrigger = triggerEl || document.activeElement;

      modalTitle.textContent = disease.name;
      modalTransmissionBadge.textContent = disease.transmission;

      const badgeStyle = BADGE_STYLES[disease.transmission] || "bg-slate-100 text-slate-800 border-slate-200";
      modalTransmissionBadge.className = `inline-block px-3 py-1 text-xs sm:text-sm font-bold rounded-full border ${badgeStyle}`;

      modalTransmissionDetail.textContent = disease.transmission_detail;
      modalSymptoms.textContent = disease.symptoms;

      detailModal.classList.remove("hidden");
      document.body.classList.add("overflow-hidden");
      modalCloseBtn.focus();
    }

    /**
     * 상세 정보 모달을 닫고 목록 화면으로 돌아갑니다.
     */
    function closeDetailModal() {
      detailModal.classList.add("hidden");
      document.body.classList.remove("overflow-hidden");

      if (lastFocusedTrigger && typeof lastFocusedTrigger.focus === "function") {
        lastFocusedTrigger.focus();
      }
    }

    // 닫기 버튼 클릭 시 모달 닫기
    modalCloseBtn.addEventListener("click", closeDetailModal);

    // 모달 바깥 배경 클릭 시 모달 닫기
    detailModal.addEventListener("click", (e) => {
      if (!modalPanel.contains(e.target)) {
        closeDetailModal();
      }
    });

    // 키보드 Escape 키 누를 시 모달 닫기
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !detailModal.classList.contains("hidden")) {
        closeDetailModal();
      }
    });

    // 초기 렌더링 실행
    window.addEventListener("DOMContentLoaded", renderDiseaseList);
  </script>
</body>
</html>
