<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감염병 검색 사전</title>
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 가독성 높은 Noto Sans KR 웹폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-white text-slate-900 font-sans antialiased selection:bg-blue-100 selection:text-blue-900 min-h-screen flex flex-col">

  <!-- =====================================================================
       1. 초기 화면 (홈 모드): 구글 메인처럼 정중앙 타이틀 + 검색창 + 추천 키워드
       ===================================================================== -->
  <div id="home-view" class="flex-1 flex flex-col items-center justify-center px-4 sm:px-6 pb-20">
    <div class="w-full max-w-2xl text-center">
      <!-- 타이틀 -->
      <h1 class="text-3xl sm:text-5xl font-bold tracking-tight text-slate-900 mb-3">
        감염병 검색 사전
      </h1>
      <p class="text-sm sm:text-base text-slate-500 mb-8">
        궁금한 감염병 이름이나 증상을 입력해 보세요.
      </p>

      <!-- 구글 스타일 둥근 검색창 -->
      <form id="home-search-form" class="relative w-full">
        <label for="home-search-input" class="sr-only">감염병 검색</label>
        <input
          type="text"
          id="home-search-input"
          autocomplete="off"
          placeholder="예: 기침, 열, 물집, 설사, 독감, 수두"
          class="w-full bg-white border border-slate-300 hover:border-slate-400 focus:border-blue-600 rounded-full py-4 pl-6 pr-24 text-base sm:text-lg text-slate-900 placeholder:text-slate-400 shadow-sm hover:shadow-md focus:shadow-md outline-none transition-all"
        >
        <button
          type="submit"
          class="absolute right-2.5 top-1/2 -translate-y-1/2 px-5 py-2 text-sm sm:text-base font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-full transition-colors"
        >
          검색
        </button>
      </form>

      <!-- 추천 검색 키워드 칩 (1~2줄 간결 배치) -->
      <div class="mt-7">
        <p class="text-xs font-medium text-slate-400 mb-3">추천 검색 키워드</p>
        <div id="home-keywords" class="flex flex-wrap items-center justify-center gap-2">
          <!-- JavaScript에서 추천 키워드 버튼을 생성합니다 -->
        </div>
      </div>
    </div>
  </div>

  <!-- =====================================================================
       2. 검색 결과 화면 (검색 모드): 구글 검색 결과 페이지 레이아웃
       ===================================================================== -->
  <div id="results-view" class="hidden flex-1 flex flex-col bg-slate-50/60">
    <!-- 상단 고정 검색 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
      <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3.5 sm:py-4 flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-6">
        <!-- 클릭 시 초기 중앙 화면으로 복귀하는 타이틀 로고 -->
        <button
          type="button"
          id="logo-home-btn"
          class="text-left text-xl sm:text-2xl font-bold tracking-tight text-slate-900 hover:text-blue-700 transition-colors shrink-0"
        >
          감염병 검색 사전
        </button>

        <!-- 상단 검색 입력창 -->
        <form id="results-search-form" class="relative flex-1">
          <label for="results-search-input" class="sr-only">감염병 다시 검색</label>
          <input
            type="text"
            id="results-search-input"
            autocomplete="off"
            placeholder="감염병 이름이나 증상을 입력하세요"
            class="w-full bg-white border border-slate-300 focus:border-blue-600 rounded-full py-2.5 pl-5 pr-28 text-sm sm:text-base text-slate-900 placeholder:text-slate-400 shadow-xs outline-none transition-colors"
          >
          <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
            <button
              type="button"
              id="results-clear-btn"
              class="hidden px-2.5 py-1 text-xs font-medium text-slate-500 hover:text-slate-900 rounded-full hover:bg-slate-100 transition-colors"
            >
              지우기
            </button>
            <button
              type="submit"
              class="px-4 py-1.5 text-xs sm:text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-full transition-colors"
            >
              검색
            </button>
          </div>
        </form>
      </div>

      <!-- 상단 헤더 하단 추천 키워드 바 -->
      <div class="border-t border-slate-100 bg-slate-50/80">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
          <span class="text-xs font-medium text-slate-400 shrink-0">추천:</span>
          <div id="results-keywords" class="flex items-center gap-1.5 shrink-0">
            <!-- JavaScript에서 추천 키워드 버튼을 생성합니다 -->
          </div>
        </div>
      </div>
    </header>

    <!-- 검색 결과 본문 리스트 -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
      <!-- 검색 결과 요약 텍스트 -->
      <p id="result-summary" class="text-xs sm:text-sm text-slate-500 mb-5">
        검색 결과 0개
      </p>

      <!-- 구글 검색 결과 형태의 세로 리스트 컨테이너 -->
      <div id="results-list" class="space-y-4">
        <!-- JavaScript에서 검색 결과 카드를 렌더링합니다 -->
      </div>

      <!-- 검색 결과가 없을 때 표시되는 안내 화면 -->
      <div id="empty-state" class="hidden bg-white border border-slate-200 rounded-2xl p-8 sm:p-12 text-center my-4">
        <p class="text-base sm:text-lg font-bold text-slate-800 mb-2">
          '<span id="empty-query-text" class="text-blue-700"></span>'에 대한 검색 결과를 찾지 못했어요.
        </p>
        <p class="text-sm text-slate-600 mb-6">
          아래 추천 키워드를 눌러서 다시 검색해 보세요.
        </p>
        <div id="empty-keywords" class="flex flex-wrap items-center justify-center gap-2 mb-6">
          <!-- JavaScript에서 추천 키워드 버튼을 생성합니다 -->
        </div>
        <button
          type="button"
          id="back-to-home-btn"
          class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors"
        >
          처음 화면으로 돌아가기
        </button>
      </div>
    </main>
  </div>

  <!-- 하단 푸터 -->
  <footer class="bg-white border-t border-slate-100 py-4 mt-auto">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 text-xs text-slate-400 flex flex-col sm:flex-row justify-between gap-1 text-center sm:text-left">

      <span>전파 경로 분류: 비말 · 침 · 물 · 접촉 · 공기</span>
    </div>
  </footer>

     */
    function switchToHomeView() {
      currentQuery = "";
      homeSearchInput.value = "";
      resultsSearchInput.value = "";
      resultsClearBtn.classList.add("hidden");

      resultsView.classList.add("hidden");
      homeView.classList.remove("hidden");
      homeSearchInput.focus();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    /**
     * 검색어를 실행하고 검색 결과 화면(검색 모드)으로 전환합니다.
     */
    function executeSearch(queryText) {
      const trimmed = queryText.trim();
      if (!trimmed) {
        homeSearchInput.focus();
        return;
      }

      currentQuery = trimmed;
      homeSearchInput.value = currentQuery;
      resultsSearchInput.value = currentQuery;
      resultsClearBtn.classList.remove("hidden");

      homeView.classList.add("hidden");
      resultsView.classList.remove("hidden");

      renderResultsKeywords();
      renderSearchResults();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    /**
     * 홈 화면 및 빈 결과 화면에 추천 검색 키워드 칩을 생성합니다.
     */
    function renderKeywordChips(container, sizeClass) {
      container.innerHTML = "";
      RECOMMENDED_KEYWORDS.forEach((keyword) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = sizeClass;
        btn.textContent = keyword;
        btn.addEventListener("click", () => {
          executeSearch(keyword);
        });
        container.appendChild(btn);
      });
    }

    /**
     * 검색 결과 페이지 상단의 추천 키워드 바를 렌더링합니다 (현재 검색어와 일치하면 활성 스타일 적용).
     */
    function renderResultsKeywords() {
      resultsKeywordsContainer.innerHTML = "";
      RECOMMENDED_KEYWORDS.forEach((keyword) => {
        const isCurrent = currentQuery.toLowerCase() === keyword.toLowerCase();
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = isCurrent
          ? "px-3 py-1 text-xs font-bold rounded-full bg-blue-600 text-white transition-colors"
          : "px-3 py-1 text-xs font-medium rounded-full bg-white text-slate-600 border border-slate-200 hover:border-slate-300 hover:text-slate-900 transition-colors";
        btn.textContent = keyword;
        btn.addEventListener("click", () => {
          executeSearch(keyword);
        });
        resultsKeywordsContainer.appendChild(btn);
      });
    }

    /**
     * RAG 방식의 문맥 기반 키워드 매칭을 수행하여 일치하는 감염병 목록을 반환합니다.
     * 이름, 전파 경로, 전파 상세 설명, 증상 텍스트 전체에서 공백 구분 다중 키워드를 탐색합니다.
     */
    function searchDiseases(query) {
      const normalized = query.trim().toLowerCase();
      const keywords = normalized.split(/\s+/).filter(Boolean);
      if (keywords.length === 0) return [];

      return DISEASE_DATA.filter((item) => {
        const fullChunk = `${item.name} ${item.transmission} ${item.transmission_detail} ${item.symptoms}`.toLowerCase();
        return keywords.every((kw) => fullChunk.includes(kw));
      });
    }

    /**
     * 검색어와 일치하는 단어를 노란색 <mark> 태그로 안전하게 강조합니다.
     */
    function createHighlightedFragment(text, query) {
      const fragment = document.createDocumentFragment();
      const trimmed = query.trim();
      if (!trimmed) {
        fragment.appendChild(document.createTextNode(text));
        return fragment;
      }

      const keywords = trimmed.split(/\s+/).filter(Boolean);
      const escapedKeywords = keywords.map((kw) => kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      const regex = new RegExp(`(${escapedKeywords.join("|")})`, "gi");
      const parts = text.split(regex);

      parts.forEach((part) => {
        if (keywords.some((kw) => part.toLowerCase() === kw.toLowerCase())) {
          const mark = document.createElement("mark");
          mark.className = "bg-amber-200 text-slate-900 rounded px-0.5 font-semibold";
          mark.textContent = part;
          fragment.appendChild(mark);
        } else {
          fragment.appendChild(document.createTextNode(part));
        }
      });

      return fragment;
    }

    /**
     * 검색 결과 카드 목록을 구글 검색 결과 스타일로 렌더링합니다.
     * 학생이 클릭 한 번 없이도 전파 경로와 주요 증상을 바로 읽고 비교할 수 있도록 구조화했습니다.
     */
    function renderSearchResults() {
      const matches = searchDiseases(currentQuery);
      resultsList.innerHTML = "";

      resultSummary.innerHTML = `'<strong class="text-slate-800">${escapeHtml(currentQuery)}</strong>' 검색 결과 <strong class="text-blue-700">${matches.length}</strong>건`;

      if (matches.length === 0) {
        resultsList.classList.add("hidden");
        emptyState.classList.remove("hidden");
        emptyQueryText.textContent = currentQuery;
        return;
      }

      resultsList.classList.remove("hidden");
      emptyState.classList.add("hidden");

      matches.forEach((disease) => {
        const article = document.createElement("article");
        article.className =
          "bg-white border border-slate-200 hover:border-slate-300 rounded-2xl p-5 sm:p-6 shadow-2xs transition-colors";

        // 1. 상단 헤더: 감염병 이름 + 전파 경로 배지
        const headerDiv = document.createElement("div");
        headerDiv.className = "flex flex-wrap items-center justify-between gap-2 pb-3.5 mb-4 border-b border-slate-100";

        const titleEl = document.createElement("h2");
        titleEl.className = "text-xl sm:text-2xl font-bold text-blue-800 tracking-tight";
        titleEl.appendChild(createHighlightedFragment(disease.name, currentQuery));

        const badgeWrapper = document.createElement("div");
        badgeWrapper.className = "flex items-center gap-2";

        const badgeLabel = document.createElement("span");
        badgeLabel.className = "text-xs font-medium text-slate-400";
        badgeLabel.textContent = "전파 경로";

        const badge = document.createElement("span");
        const badgeStyle = BADGE_STYLES[disease.transmission] || "bg-slate-100 text-slate-800 border-slate-200";
        badge.className = `inline-block px-3 py-1 text-xs sm:text-sm font-bold rounded-full border ${badgeStyle}`;
        badge.appendChild(createHighlightedFragment(disease.transmission, currentQuery));

        badgeWrapper.appendChild(badgeLabel);
        badgeWrapper.appendChild(badge);

        headerDiv.appendChild(titleEl);
        headerDiv.appendChild(badgeWrapper);

        // 2. 본문 영역: 어떻게 옮나요? & 어떤 증상이 나타나나요? (초3 눈높이 구조화)
        const bodyGrid = document.createElement("div");
        bodyGrid.className = "grid grid-cols-1 md:grid-cols-2 gap-3.5 sm:gap-4";

        // 전파 경로 설명 박스
        const transBox = document.createElement("div");
        transBox.className = "bg-slate-50 rounded-xl p-4 border border-slate-100";

        const transTitle = document.createElement("h3");
        transTitle.className = "text-xs sm:text-sm font-bold text-slate-700 mb-1.5";
        transTitle.textContent = "어떻게 옮나요?";

        const transText = document.createElement("p");
        transText.className = "text-sm sm:text-base text-slate-800 leading-relaxed";
        transText.appendChild(createHighlightedFragment(disease.transmission_detail, currentQuery));

        transBox.appendChild(transTitle);
        transBox.appendChild(transText);

        // 주요 증상 설명 박스
        const sympBox = document.createElement("div");
        sympBox.className = "bg-slate-50 rounded-xl p-4 border border-slate-100";

        const sympTitle = document.createElement("h3");
        sympTitle.className = "text-xs sm:text-sm font-bold text-slate-700 mb-1.5";
        sympTitle.textContent = "어떤 증상이 나타나나요?";

        const sympText = document.createElement("p");
        sympText.className = "text-sm sm:text-base text-slate-800 leading-relaxed";
        sympText.appendChild(createHighlightedFragment(disease.symptoms, currentQuery));

        sympBox.appendChild(sympTitle);
        sympBox.appendChild(sympText);

        bodyGrid.appendChild(transBox);
        bodyGrid.appendChild(sympBox);

        article.appendChild(headerDiv);
        article.appendChild(bodyGrid);
        resultsList.appendChild(article);
      });
    }

    /**
     * HTML 특수문자 이스케이프 헬퍼 함수
     */
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // =========================================================================
    // 이벤트 리스너 바인딩
    // =========================================================================

    // 초기 화면 검색 폼 제출
    homeSearchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      executeSearch(homeSearchInput.value);
    });

    // 검색 결과 화면 상단 로고 클릭 시 초기 화면 복귀
    logoHomeBtn.addEventListener("click", switchToHomeView);
    backToHomeBtn.addEventListener("click", switchToHomeView);

    // 검색 결과 화면 검색 폼 제출
    resultsSearchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      executeSearch(resultsSearchInput.value);
    });

    // 검색 결과 화면 입력창 실시간 입력 시 결과 갱신 및 지우기 버튼 제어
    resultsSearchInput.addEventListener("input", (e) => {
      const val = e.target.value;
      if (val.length > 0) {
        resultsClearBtn.classList.remove("hidden");
      } else {
        resultsClearBtn.classList.add("hidden");
      }

      if (val.trim().length > 0) {
        currentQuery = val.trim();
        renderResultsKeywords();
        renderSearchResults();
      }
    });

    // 검색 결과 화면 입력창 지우기 버튼
    resultsClearBtn.addEventListener("click", () => {
      resultsSearchInput.value = "";
      resultsClearBtn.classList.add("hidden");
      resultsSearchInput.focus();
    });

    // 초기 로드 시 추천 키워드 칩 렌더링 및 검색창 포커스
    window.addEventListener("DOMContentLoaded", () => {
      const homeChipStyle =
        "px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 hover:text-slate-900 rounded-full transition-colors";
      renderKeywordChips(homeKeywordsContainer, homeChipStyle);
      renderKeywordChips(emptyKeywordsContainer, homeChipStyle);
      homeSearchInput.focus();
    });
  </script>
</body>
</html>
